[project]
name = "pncp-collector"
version = "0.1.0"
description = "Coletor de atas de registro de precos e contratos do PNCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
pncp-collector = "pncp_collector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pncp_collector"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
